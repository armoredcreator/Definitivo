name: Definitivo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install project and test dependencies
        run: python -m pip install . pytest
      - name: Compile application and tests
        run: python -m compileall -q ArmoredSpeech ArmoredStudio ArmoredSync ArmoredVision ArmoredStock ArmoredIA ArmoredHub armored_core scripts tests
      - name: Run full regression suite
        run: python -m pytest -q -rs
